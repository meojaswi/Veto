services:
  #postgres service for database connection
  postgres:
    image: postgres:16
    environment:
      { POSTGRES_USER: veto, POSTGRES_PASSWORD: veto, POSTGRES_DB: veto }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veto"]
      interval: 3s
      retries: 10
  #redis service for caching and background tasks
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://veto:veto@postgres:5432/veto
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["./backend:/srv"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  #worker service for background tasks
  worker:
    build: ./backend
    command: arq app.worker.main.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://veto:veto@postgres:5432/veto
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/srv"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
